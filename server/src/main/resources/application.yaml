spring:
  application:
    name: server

  datasource:
    url: jdbc:mysql://localhost:3306/life_inbox?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: root
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 21MB

life-inbox:
  storage:
    upload-dir: uploads
