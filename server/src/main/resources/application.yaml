spring:
  application:
    name: server

  datasource:
    url: jdbc:mysql://localhost:3306/life_inbox?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: root
    # 密码通过环境变量注入，避免把本机凭据提交到 Git。
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  servlet:
    multipart:
      # Spring 会在请求进入 Controller 前执行 multipart 总大小限制。
      max-file-size: 20MB
      max-request-size: 21MB

life-inbox:
  storage:
    # 相对路径以 server 的启动目录为基准，运行时目录已由 .gitignore 忽略。
    upload-dir: uploads
  ai:
    # AI 服务地址必须可由环境变量覆盖，避免业务代码绑定到某个部署地址。
    base-url: ${AI_SERVICE_BASE_URL:http://localhost:8000}
    # 跨服务调用必须有连接和读取超时，Python 不可用时 Java 才能快速失败。
    connect-timeout: 2s
    read-timeout: 5s
    # Analyze 内部还要等待 LLM，Java 上限应略大于 Python 的默认 20 秒超时。
    analysis-read-timeout: 30s
    # Rerank 位于同步搜索路径，Java 上限略大于 Python 默认的 8 秒 Provider 超时。
    rerank-read-timeout: 10s
    # 默认保持 Task 28 的纯 RRF 行为，显式启用后 Hybrid 才调用可选 Reranker。
    rerank-enabled: ${LIFEINBOX_RERANK_ENABLED:false}
    # 超过该时间的 PROCESSING 可由用户手动接管；应明显大于一次正常 Analyze 的预期耗时。
    processing-stale-after: 5m
    # 自动 Analyze 默认关闭，避免升级后未经用户确认就调用真实 LLM 并产生费用。
    auto-analyze-enabled: ${LIFEINBOX_AI_AUTO_ANALYZE_ENABLED:false}
